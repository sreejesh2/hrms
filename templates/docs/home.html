{% extends "base_app.html" %}
{% block content %}
<section class="panel">
  <div class="panel-header">
    <h2 class="panel-title">Documentation</h2>
  </div>
  <div class="panel-body muted" style="border-bottom:1px solid var(--border)">
    Full Day Pay guide — open any module for purpose, who uses it, setup steps, workflows, and screen links.
  </div>
  <div class="panel-body">
    <div class="stats-grid" style="margin:0">
      {% for m in modules %}
        <a class="stat-card" href="{% url 'docs:module' m.slug %}" style="text-decoration:none;color:inherit">
          <p class="stat-label">{{ m.title }}</p>
          <p class="stat-value" style="font-size:0.95rem;font-weight:500;line-height:1.45">{{ m.summary }}</p>
        </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
