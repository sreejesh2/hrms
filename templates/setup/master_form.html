{% extends "base_app.html" %}
{% block content %}
<section class="panel">
  <div class="panel-header">
    <h2 class="panel-title">{{ page_title }}</h2>
    <a class="btn" href="{% url 'setup:master_list' master_key %}">Back to {{ cfg.plural }}</a>
  </div>
  <div class="panel-body">
    <form method="post" novalidate class="form-stack">
      {% csrf_token %}
      {% for field in form %}
        {% include "partials/form_field.html" with field=field %}
      {% endfor %}
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn" href="{% url 'setup:master_list' master_key %}">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
