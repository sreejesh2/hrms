# Day Pay HRMS — nginx site (installed to /etc/nginx/sites-available/daypay)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Employee documents / receipts upload limit
    client_max_body_size 20m;

    # Static files straight from disk (collectstatic output)
    location /static/ {
        alias /opt/daypay/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # NOTE: no /media/ block on purpose — uploaded files go through Django,
    # which checks the user is allowed to see them.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # long payroll runs / big exports
    }
}
