{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ theme|default:'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title|default:app_name|default:"Day Pay" }}{% endblock %} · {{ app_name|default:"Day Pay" }}</title>
  <script>
    (function () {
      try {
        var m = document.cookie.match(/(?:^|; )hrms_theme=([^;]*)/);
        var t = m ? decodeURIComponent(m[1]) : "{{ theme|default:'light' }}";
        if (t !== "light" && t !== "dark") t = "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      try {
        var s = localStorage.getItem("hrms.sidebar");
        if (s === "short" || s === "open") {
          document.documentElement.setAttribute("data-sidebar", s);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'vendor/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=global-responsive-ui1">
  {% block extra_css %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script src="{% static 'js/app.js' %}?v=global-responsive-ui1" defer></script>
{% block extra_js %}{% endblock %}
</body>
</html>
