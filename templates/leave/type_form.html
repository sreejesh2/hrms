{% extends "base_app.html" %}
{% block content %}
<section class="panel">
  <div class="panel-header">
    <h2 class="panel-title">{{ page_title }}</h2>
</div>
  <div class="panel-body">
    <form method="post" class="form-stack form-stack-wide" novalidate>
      {% csrf_token %}
      <div class="form-grid-2">
        {% for field in form %}{% include "partials/form_field.html" with field=field %}{% endfor %}
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
