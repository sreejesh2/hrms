services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms}
    # No published port: only the web container can reach the database.
    volumes:
      - daypay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://hrms:${POSTGRES_PASSWORD:-hrms}@db:5432/hrms
      # ALLOWED_HOSTS comes from .env (DJANGO_ALLOWED_HOSTS). Add "web" if
      # containers call each other by service name.
    ports:
      - "8000:8000"
    volumes:
      - daypay_media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  daypay_pg:
  daypay_media:
